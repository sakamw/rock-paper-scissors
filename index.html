<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="icon" href="assets/rps.jpg" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section id="container">
      <div class="game-area">
        <div class="game-header">
          <p class="copyright">
            &copy; 2025
            <a
              href="https://github.com/sakamw/rock-paper-scissors"
              target="_blank"
              style="
                text-decoration: underline;
                color: #5c2f76;
                font-size: 1.2rem;
              "
              >Isaac Mwangi</a
            >
          </p>
          <p class="score" id="scoreboard">computer 0 0 player</p>
        </div>
        <div class="player-box marg-top" id="computer-box">
          <p class="player-box--title">Computer</p>
          <p class="emoji" id="computer-choice-emoji">✌️</p>
        </div>
        <p class="winner-announce" id="winner-announce">currently draw</p>
        <div class="player-box" id="player-box">
          <p class="player-box--title">Player</p>
          <p class="emoji" id="player-choice-emoji">✌️</p>
        </div>
      </div>

      <div class="scoreboard"></div>
      <div class="user-choices">
        <button class="choice-button" id="rock-btn">
          <p class="button-emoji">✊</p>
          <p class="button-text">rock</p>
        </button>
        <button class="choice-button" id="paper-btn">
          <p class="button-emoji">✋</p>
          <p class="button-text">paper</p>
        </button>
        <button class="choice-button" id="scissors-btn">
          <p class="button-emoji">✌️</p>
          <p class="button-text">scissors</p>
        </button>
      </div>
    </section>

    <script src="rockPaperScissors.js"></script>
  </body>
</html>
